<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand assets — Kinomorphic</title>
<style>
  body{margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;background:#f7f5f1;color:#26261f;padding:40px;}
  h1{font-family:Georgia,serif;font-weight:400;font-size:1.4rem;}
  .grid{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0 34px;}
  .swatch{display:grid;place-items:center;border-radius:10px;}
  .light{background:#f7f5f1;border:1px solid #e3ded6;}
  .dark{background:#21211f;}
  .lab{font-size:.62rem;letter-spacing:.1em;color:#8a857c;margin-top:6px;text-align:center;}
  img{display:block;}
  .col{display:flex;flex-direction:column;align-items:center;gap:4px;}
</style></head>
<body>
<h1>Settling Ring — favicon.svg</h1>
<div class="grid">
  <div class="col"><div class="swatch light" style="width:128px;height:128px;"><img src="favicon.svg" width="84" height="84"></div><div class="lab">light · 84</div></div>
  <div class="col"><div class="swatch light" style="width:64px;height:64px;"><img src="favicon.svg" width="40" height="40"></div><div class="lab">40</div></div>
  <div class="col"><div class="swatch light" style="width:48px;height:48px;"><img src="favicon.svg" width="24" height="24"></div><div class="lab">24</div></div>
  <div class="col"><div class="swatch light" style="width:40px;height:40px;"><img src="favicon.svg" width="16" height="16"></div><div class="lab">16</div></div>
  <div class="col"><div class="swatch dark" style="width:128px;height:128px;"><img src="favicon.svg" width="84" height="84"></div><div class="lab">dark · 84</div></div>
  <div class="col"><div class="swatch dark" style="width:48px;height:48px;"><img src="favicon.svg" width="24" height="24"></div><div class="lab">24</div></div>
</div>
<h1>Lissajous — favicon-lissajous.svg</h1>
<div class="grid">
  <div class="col"><div class="swatch light" style="width:128px;height:128px;"><img src="favicon-lissajous.svg" width="84" height="84"></div><div class="lab">light · 84</div></div>
  <div class="col"><div class="swatch light" style="width:48px;height:48px;"><img src="favicon-lissajous.svg" width="24" height="24"></div><div class="lab">24</div></div>
  <div class="col"><div class="swatch dark" style="width:128px;height:128px;"><img src="favicon-lissajous.svg" width="84" height="84"></div><div class="lab">dark · 84</div></div>
  <div class="col"><div class="swatch dark" style="width:48px;height:48px;"><img src="favicon-lissajous.svg" width="24" height="24"></div><div class="lab">24</div></div>
</div>
</body></html>
