[project]
name = "miscope-workspace"
version = "0.0.0"
description = "MIScope monorepo workspace root (not published)"
requires-python = ">=3.11"
dependencies = [
    "miscope",
    "dashboard",
    "pytest>=9.0.2",
    "duckdb>=1.5.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright==1.1.408",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/miscope", "apps/dashboard"]

[tool.uv.sources]
miscope = { workspace = true }
dashboard = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/miscope/tests",
    "apps/dashboard/tests",
    "tests/integration",
]
# Use importlib mode so multiple `tests` packages across the workspace
# don't collide on import.
addopts = "--import-mode=importlib"
# `scripts/` is not a package; expose it so tests can import the shared
# regression-harness module (regression_common) the way the scripts do.
pythonpath = ["scripts"]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "*.ipynb",
    "apps/research/sketches/*",
    "docs/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["miscope", "dashboard"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Mirror pytest's `pythonpath = ["scripts"]` so callers that import the shared
# regression-harness modules (the way the scripts do) resolve.
extraPaths = ["scripts"]
ignore = [
    "*.ipynb",
    "apps/research/sketches",
    "docs",
]

# Tests duck-type domain objects (_FakeVariant, _FakeLoader) and lean on pandas /
# numpy, whose partial inline stubs trip basic-mode checks (Series vs ndarray,
# numpy scalars). That is fixture noise, not bugs — relax the affected rules for
# the test trees only; src stays strict.
[[tool.pyright.executionEnvironments]]
root = "packages/miscope/tests"
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = false

[[tool.pyright.executionEnvironments]]
root = "apps/dashboard/tests"
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = false

[[tool.pyright.executionEnvironments]]
root = "tests/integration"
extraPaths = ["scripts"]
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportGeneralTypeIssues = false
